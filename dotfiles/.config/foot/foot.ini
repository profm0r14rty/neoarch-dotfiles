# Foot — fast terminal, matching the desktop palette.
[main]
font=JetBrainsMono Nerd Font:size=11
pad=10x10
initial-window-size-chars=108x32
resize-delay-ms=100
term=foot

[cursor]
style=beam
blink=yes

[scrollback]
lines=10000

[colors-dark]
background=11111b
foreground=cdd6f4
selection-background=45475a
selection-foreground=cdd6f4
regular0=45475a
regular1=f38ba8
regular2=a6e3a1
regular3=f9e2af
regular4=89b4fa
regular5=cba6f7
regular6=94e2d5
regular7=bac2de
bright0=585b70
bright1=f38ba8
bright2=a6e3a1
bright3=f9e2af
bright4=89b4fa
bright5=cba6f7
bright6=94e2d5
bright7=a6adc8

[bell]
urgent=no
notify=no
visual=no
