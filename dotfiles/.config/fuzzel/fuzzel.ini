# Fuzzel application launcher — centered, compact, Catppuccin Mocha.
[main]
font=JetBrainsMono Nerd Font:size=11
prompt="❯ "
placeholder="Search applications"
icons-enabled=yes
icon-theme=Adwaita
fields=name,generic,comment,categories,filename,keywords
match-mode=fuzzy
sort-result=yes
lines=9
width=44
horizontal-pad=18
vertical-pad=12
inner-pad=8
layer=overlay
anchor=center
terminal=foot -e

[colors]
background=11111bf2
text=cdd6f4ff
prompt=b4befeff
placeholder=6c7086ff
input=cdd6f4ff
match=cba6f7ff
selection=313244ff
selection-text=cdd6f4ff
selection-match=b4befeff
border=45475aff

[border]
width=1
radius=0
selection-radius=0
