# Fuzzel application launcher — centered, compact, Catppuccin Mocha.
[main]
font=JetBrainsMono Nerd Font:size=12
prompt="❯ "
placeholder="Search applications"
icons-enabled=yes
icon-theme=Adwaita
fields=name,generic,comment,categories,filename,keywords
match-mode=fuzzy
sort-result=yes
lines=12
width=52
horizontal-pad=22
vertical-pad=16
inner-pad=10
layer=overlay
anchor=center
terminal=foot -e

[colors]
background=11111bf2
text=cdd6f4ff
prompt=b4befeff
placeholder=6c7086ff
input=cdd6f4ff
match=cba6f7ff
selection=313244ff
selection-text=cdd6f4ff
selection-match=b4befeff
border=45475aff

[border]
width=1
radius=8
selection-radius=5
